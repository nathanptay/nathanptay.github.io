<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Featured Projects</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/processing.js/1.6.6/processing.min.js"></script>

  <style>
    /* Reset margins and force full viewport width */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .main-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
      text-transform: uppercase;
    }

    /* FEATURED DISPLAY: Grid split exactly down the 50% window mark */
    .featured-card {
      display: grid;
      grid-template-columns: 1fr 1fr; /* Center line is dead center of the screen */
      column-gap: 40px;               /* Space across center */
      width: 100%;
      box-sizing: border-box;
    }

    /* CANVAS: Pushed right up to the left of the center line */
    .canvas-container {
      justify-self: end;
      width: auto;
      height: auto;
      background: #111;
      display: inline-block;
    }

    /* INFO PANEL: Starts right at the right of the center line */
    .info-container {
      justify-self: start;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-container h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .info-container p {
      margin: 0;
      font-size: 14px;
      color: #cccccc;
      line-height: 1.4;
    }

    .meta-item {
      font-size: 14px;
      color: #dddddd;
    }

    .read-more-btn {
      display: inline-block;
      align-self: flex-start;
      margin-top: 10px;
      padding: 10px 24px;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .read-more-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    /* THUMBNAIL SELECTOR ROW */
    .selector-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .thumb-card {
      width: 60px;
      height: 60px;
      background: #222222;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #aaa;
    }

    .thumb-card:hover {
      opacity: 0.8;
    }

    .thumb-card.active {
      border-color: #fff;
      opacity: 1;
    }
  </style>
</head>

    function renderCards() {
      var container = document.getElementById("cardContainer");
      container.innerHTML = "";

      projects.forEach(function(proj, index) {
        var card = document.createElement("div");
        card.className = "thumb-card" + (index === 0 ? " active" : "");
        card.id = "card-" + index;
        card.onclick = function() { selectProject(index); };
        card.textContent = "#" + (index + 1);

        container.appendChild(card);
      });
    }

    function selectProject(index) {
      if (currentProcessingInstance) {
        currentProcessingInstance.exit();
      }

      var cards = document.querySelectorAll(".thumb-card");
      cards.forEach(function(c) { c.classList.remove("active"); });
      document.getElementById("card-" + index).classList.add("active");

      var selected = projects[index];
      document.getElementById("projectTitle").textContent = selected.title;
      document.getElementById("projectDescription").textContent = selected.description;
      document.getElementById("projectDate").textContent = selected.date;
      document.getElementById("projectAuthor").textContent = selected.author;
      document.getElementById("projectLang").textContent = selected.languages;
      document.getElementById("projectLink").href = selected.link;

      var canvas = document.getElementById("myCanvas");
      currentProcessingInstance = new Processing(canvas, selected.code);
    }

    window.onload = function() {
      renderCards();
      selectProject(0);
    };
  </script>
